        .tabla td { color: var(--text); white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
        .tabla td.corta { white-space: nowrap; }
        .tabla .c0 { position: sticky; left: 0; z-index: 1; background: var(--surface); font-weight: 600; }
        .tabla th.c0 { z-index: 3; background: var(--surface-2); }
        .tabla tbody tr:hover td { background: color-mix(in srgb, var(--brand) 5%, var(--surface)); }
        .tabla tr.mia td { background: color-mix(in srgb, var(--brand) 12%, var(--surface)) !important; }
        .tabla tr.mia td.c0 { box-shadow: inset 3px 0 0 var(--brand); }
        .tabla .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .tabla a { color: var(--brand-text); text-decoration: underline; text-underline-offset: 2px; }
        .tabla .vacia { color: var(--text-3); }
        .cod { display: inline-grid; place-items: center; min-width: 24px; height: 22px; padding: 0 5px; border-radius: 6px; font-size: 11.5px; font-weight: 700; }
        .cod-A { background: var(--ok-soft); color: var(--ok); } .cod-R { background: var(--warn-soft); color: var(--warn); }
        .cod-F { background: var(--danger-soft); color: var(--danger); } .cod-D { background: var(--surface-3); color: var(--text-3); }
        .cod-V { background: var(--quality-soft); color: var(--quality); } .cod-J { background: var(--bath-soft); color: var(--bath); }
        .script-txt { white-space: pre-wrap; line-height: 1.6; font-size: 14.5px; color: var(--text); }
        .app-card { transition: border-color .15s, box-shadow .15s, transform .15s; }
        .app-card:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--border)); transform: translateY(-1px); }
        .ed-cel { min-width: 60px; outline: none; white-space: pre-wrap; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
        .ed-cel:hover { background: color-mix(in srgb, var(--brand) 6%, transparent); }
        .ed-cel:focus { box-shadow: 0 0 0 2px var(--brand); background: var(--surface); }
        .ed-area { height: auto !important; min-height: 110px; padding: 10px 12px !important; line-height: 1.55; resize: vertical; }
        .ed-add { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 120px; border-style: dashed !important; color: var(--text-2); font-weight: 600; }

        body.editando .solo-lectura { display: none !important; }
        mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

                    ${area('apps', i, 2, a[2] || '', '¿Para qué sirve?', 3)}
                    ${campo('apps', i, 3, a[3] || '', 'Nota (opcional)', '!text-[13px]')}
                </div>`).join('') + `<button class="card ed-add" data-act="add" data-k="apps" data-n="4"><i class="ph-bold ph-plus-circle text-xl"></i> Agregar aplicativo</button>`;
        }
        function tablaEd(id, kc, kr) {
            const cab = borrador[kc], filas = borrador[kr];
            const cel = (k, i, j, v) => `<div class="ed-cel" contenteditable="plaintext-only" spellcheck="false" data-k="${k}" ${i === null ? '' : `data-i="${i}"`} data-j="${j}">${esc(v || '')}</div>`;
            $(id).innerHTML = `<thead><tr>${cab.map((c, j) => `<th class="${j === 0 ? 'c0' : ''}">${cel(kc, null, j, c)}</th>`).join('')}<th style="width:1%"></th></tr></thead>
                <tbody>${filas.map((f, i) => `<tr>${cab.map((_, j) => `<td class="${j === 0 ? 'c0' : ''}">${cel(kr, i, j, f[j])}</td>`).join('')}<td class="corta">${flechas(kr, i, filas.length)}</td></tr>`).join('')}</tbody>
                <tfoot><tr><td colspan="${cab.length + 1}"><button class="btn btn-secondary btn-sm" data-act="add" data-k="${kr}" data-n="${cab.length}"><i class="ph-bold ph-plus"></i> Agregar fila</button></td></tr></tfoot>`;
        }
        document.addEventListener('input', (e) => {
            const t = e.target.closest && e.target.closest('[data-k][data-j]');
            if (!t || !editando) return;
            const v = t.isContentEditable ? t.innerText.replace(/\n$/, '') : t.value;
            const k = t.dataset.k, j = +t.dataset.j;
            if (t.dataset.i === undefined) borrador[k][j] = v;
            else { const f = borrador[k][+t.dataset.i]; while (f.length < j) f.push(''); f[j] = v; }
            marcar(true);
        });
        document.addEventListener('click', (e) => {
            const b = e.target.closest && e.target.closest('[data-act]');
            if (!b || !editando) return;
            const k = b.dataset.k, i = +b.dataset.i, L = borrador[k];
            if (b.dataset.act === 'del') L.splice(i, 1);
            else if (b.dataset.act === 'up' && i > 0) [L[i - 1], L[i]] = [L[i], L[i - 1]];
            else if (b.dataset.act === 'down' && i < L.length - 1) [L[i + 1], L[i]] = [L[i], L[i + 1]];
            else if (b.dataset.act === 'add') L.push(Array(+b.dataset.n).fill(''));
            marcar(true); mostrar(actual);
            if (b.dataset.act === 'add') {
                const nuevos = document.querySelectorAll(`[data-k="${k}"][data-i="${L.length - 1}"][data-j="0"]`);
                if (nuevos[0]) { nuevos[0].scrollIntoView({ block: 'center' }); nuevos[0].focus(); }
            }
        });

        // ---------- Navegación ----------
        const TITULOS = { scripts: 'Scripts', autenticacion: 'Autenticación', aplicativos: 'Aplicativos', directorio: 'Directorio', rol: 'Rol de turnos', adherencia: 'Adherencia del mes', productividad: 'Productividad del mes' };
        let actual = null;
        function mostrar(sec) {
            actual = sec;
            document.querySelectorAll('.seccion').forEach(s => s.classList.toggle('activa', s.id === 'sec-' + sec));
            document.querySelectorAll('.sec-link').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
            $('menu-movil').value = sec;
            $('titulo').textContent = TITULOS[sec];
            let n = 0, sub = '';
            if (editando && SECCION_CLAVES[sec]) {
                if (sec === 'scripts') scriptsEd();
                else if (sec === 'autenticacion') { tablaEd('t-aut', 'autCab', 'aut'); tablaEd('t-tipo', 'tipoCab', 'tipo'); }
                else if (sec === 'aplicativos') appsEd();
                else { tablaEd('t-dir', 'dirCab', 'dir'); tablaEd('t-reg', 'regCab', 'reg'); tablaEd('t-inter', 'interCab', 'inter'); }
                sub = 'Toca cualquier texto para cambiarlo · los asesores lo verán al guardar';
            }
            else if (sec === 'scripts') { n = pintarScripts(); sub = `${n} scripts · toca "Copiar" para pegarlo`; }
            else if (sec === 'autenticacion') { n = tabla('t-aut', D.autCab, D.aut); tabla('t-tipo', D.tipoCab, D.tipo); sub = 'Qué validar antes de cada trámite'; }
            else if (sec === 'aplicativos') { n = pintarApps(); sub = `${n} herramientas`; }
            else if (sec === 'directorio') { n = tabla('t-dir', D.dirCab, D.dir); tabla('t-reg', D.regCab, D.reg); tabla('t-inter', D.interCab, D.inter); sub = 'Teléfonos y extensiones'; }
            else {
                n = pintarDiaria(sec);
                const d = datosDiarios[sec];
                sub = d ? `Copiado de la hoja el ${new Date(d.actualizado).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' })} a las ${new Date(d.actualizado).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false })} · se actualiza diario a las 12:00` : 'Se actualiza diario a las 12:00';
            }
            if (!editando && SECCION_CLAVES[sec] && esSup && editadoEn) sub += ` · editado el ${new Date(editadoEn).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' })}`;
            $('subtitulo').textContent = sub;
            botonEditar();
            history.replaceState(null, '', '#' + sec);
        }
        document.querySelectorAll('.sec-link').forEach(b => b.addEventListener('click', () => mostrar(b.dataset.sec)));
        $('menu-movil').addEventListener('change', (e) => mostrar(e.target.value));
        ['buscar', 'buscar-m'].forEach(id => $(id).addEventListener('input', () => mostrar(actual)));
        mostrar(TITULOS[location.hash.slice(1)] ? location.hash.slice(1) : 'scripts');
    </script>
</body>
</html>
